name: Level 4 - Factor Orthogonalizer

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/neutralizer.py"
      - "test_level_4.py"
      - "requirements.txt"
      - ".github/workflows/level_4_tests.yml"

  pull_request:
    paths:
      - "src/neutralizer.py"
      - "test_level_4.py"
      - "requirements.txt"
      - ".github/workflows/level_4_tests.yml"

permissions:
  contents: read

jobs:

  level-4-validation:

    name: Level 4 Validation

    runs-on: ubuntu-latest

    timeout-minutes: 8

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Level 4 factor-neutralization gate
        run: |
          pytest -vv test_level_4.py

      - name: Regression-check Level 3 mechanics
        run: |
          pytest -q test_level_3.py \
            -k "not live_yfinance_90d_mean_rank_ic_exceeds_threshold"

      - name: Regression-check Level 2
        run: |
          pytest -q test_level_2.py

      - name: Regression-check Level 1
        run: |
          pytest -q test_level_1.py
