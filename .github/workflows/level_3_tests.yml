name: Level 3 - Historical Backtester

on:
  workflow_dispatch:
    inputs:
      run_live_yfinance:
        description: "Run empirical historical-price Rank IC gate"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - "src/backtest_runner.py"
      - "test_level_3.py"
      - "requirements.txt"
      - ".github/workflows/level_3_tests.yml"

  pull_request:
    paths:
      - "src/backtest_runner.py"
      - "test_level_3.py"
      - "requirements.txt"
      - ".github/workflows/level_3_tests.yml"

permissions:
  contents: read

jobs:

  mechanical-validation:

    name: Level 3 Mechanical Validation

    runs-on: ubuntu-latest

    timeout-minutes: 8

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Level 3 mechanical gate
        run: |
          pytest -v test_level_3.py

      - name: Regression-check Level 2
        run: |
          pytest -q test_level_2.py

      - name: Regression-check Level 1
        run: |
          pytest -q test_level_1.py


  empirical-yfinance-validation:

    name: Level 3 Empirical Yahoo Rank IC

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.run_live_yfinance == true

    runs-on: ubuntu-latest

    timeout-minutes: 8

    env:
      RUN_LIVE_YFINANCE: "1"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run empirical yfinance gate
        run: |
          pytest -vv test_level_3.py \
            -k live_yfinance_90d_mean_rank_ic_exceeds_threshold
