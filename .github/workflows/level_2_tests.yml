name: Level 2 - PIT Anonymizer and Agent Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/anonymizer.py"
      - "src/agent.py"
      - "test_level_2.py"
      - "requirements.txt"
      - ".github/workflows/level_2_tests.yml"

  pull_request:
    paths:
      - "src/anonymizer.py"
      - "src/agent.py"
      - "test_level_2.py"
      - "requirements.txt"
      - ".github/workflows/level_2_tests.yml"

permissions:
  contents: read

jobs:
  level-2-tests:
    name: Level 2 Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show Python environment
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Level 2 test gate
        run: |
          pytest -v test_level_2.py

      - name: Regression-check Level 1
        run: |
          pytest -q test_level_1.py
