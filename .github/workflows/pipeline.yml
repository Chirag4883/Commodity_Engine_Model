name: Module 1 - Weekly Quant Pipeline

on:

  schedule:
    - cron: "0 2 * * 6"

  workflow_dispatch:
    inputs:
      run_mode:
        description: "Pipeline mode"
        required: true
        default: "mock"
        type: choice
        options:
          - mock
          - live

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "app.py"
      - "test_level_*.py"
      - "requirements.txt"
      - ".github/workflows/pipeline.yml"

  pull_request:
    paths:
      - "src/**"
      - "app.py"
      - "test_level_*.py"
      - "requirements.txt"
      - ".github/workflows/pipeline.yml"


jobs:

  validation:

    name: Level 5 Validation

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Level 5 dry-run gate
        run: |
          pytest -vv test_level_5.py

      - name: Run explicit mock pipeline
        run: |
          python -m src.live_pipeline \
            --mode mock \
            --output data/latest_alpha_factors.parquet \
            --metadata data/pipeline_metadata.json

      - name: Validate Parquet artifact
        run: |
          python - <<'PY'
          import pandas as pd
          from src.live_pipeline import validate_alpha_frame

          path = "data/latest_alpha_factors.parquet"
          frame = pd.read_parquet(path)

          validate_alpha_frame(frame)

          print("rows =", len(frame))
          print("status =", frame["pipeline_status"].iloc[0])
          print("alpha_mean =", frame["alpha_z"].mean())
          print("alpha_std =", frame["alpha_z"].std(ddof=0))
          print("events =", frame["event_count"].iloc[0])
          PY

      - name: Regression-check Level 4
        run: |
          pytest -q test_level_4.py

      - name: Regression-check Level 3
        run: |
          pytest -q test_level_3.py \
            -k "not live_yfinance_90d_mean_rank_ic_exceeds_threshold"

      - name: Regression-check Level 2
        run: |
          pytest -q test_level_2.py

      - name: Regression-check Level 1
        run: |
          pytest -q test_level_1.py


  live-pipeline:

    name: Weekly Live Pipeline

    if: >
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.run_mode == 'live'
      )

    needs:
      - validation

    runs-on: ubuntu-latest

    timeout-minutes: 25

    permissions:
      contents: write

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: "gpt-5.6-luna"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate live secrets
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY GitHub secret is missing."
            exit 1
          fi

      - name: Execute live Module 1 pipeline
        run: |
          python -m src.live_pipeline \
            --mode live \
            --output data/latest_alpha_factors.parquet \
            --metadata data/pipeline_metadata.json

      - name: Validate live output
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          from src.live_pipeline import validate_alpha_frame

          frame = pd.read_parquet(
              "data/latest_alpha_factors.parquet"
          )

          validate_alpha_frame(frame)

          metadata = json.load(
              open(
                  "data/pipeline_metadata.json",
                  encoding="utf-8",
              )
          )

          print("Rows:", len(frame))
          print("Status:", metadata["pipeline_status"])
          print("Events:", metadata["event_count"])
          print(
              "Routed candidates:",
              metadata["routed_candidate_count"],
          )
          print(
              "Source failures:",
              metadata["source_failures"],
          )
          print(
              "Runtime seconds:",
              metadata["total_duration_seconds"],
          )
          PY

      - name: Commit latest factor artifact
        shell: bash
        run: |
          git config user.name "commodity-engine-bot"
          git config user.email "actions@github.com"

          git add \
            data/latest_alpha_factors.parquet \
            data/pipeline_metadata.json

          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: update weekly Module 1 alpha factors"

          git push
