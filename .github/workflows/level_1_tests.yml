name: Level 1 - Supply Chain Graph Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test_level_1.py"
      - "requirements.txt"
      - ".github/workflows/level_1_tests.yml"

  pull_request:
    paths:
      - "src/**"
      - "test_level_1.py"
      - "requirements.txt"
      - ".github/workflows/level_1_tests.yml"

permissions:
  contents: read

jobs:
  level-1-tests:
    name: Level 1 Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show Python environment
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Level 1 test gate
        run: |
          pytest -v test_level_1.py

      - name: Run graph smoke test
        run: |
          python -m src.graph_engine
